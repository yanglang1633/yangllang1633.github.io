<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>工作量计分计算器</title>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f0f6ff;padding:12px;margin:0;color:#333;}
.wrap{max-width:1100px;margin:0 auto;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 8px rgba(0,0,0,0.06);}
h1{text-align:center;font-size:1.5rem;margin:16px 0;color:#1d4ed8;}
h3{font-size:1rem;margin:0 0 12px 0;color:#1f2937;}

/* 表单 */
.flex-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.form-item{flex:1;min-width:200px;}
label{display:block;margin-bottom:6px;color:#444;font-size:14px;}

/* 新的输入组样式（代替原生箭头） */
.input-wrap{display:flex;align-items:center;}
.input-wrap input{
  flex:1;
  border:1px solid #d1d5db;
  border-radius:0;
  padding:10px;
  font-size:15px;
  background:#fff;
  outline:none;
  text-align:center;
  -moz-appearance:textfield;
}
.input-wrap input::-webkit-inner-spin-button,
.input-wrap input::-webkit-outer-spin-button{-webkit-appearance:none;}
.input-wrap input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15);}

.btn-step{
  background:#e5e7eb;
  border:none;
  width:36px;
  height:40px;
  font-size:18px;
  color:#374151;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}
.btn-step:active{background:#d1d5db;}
.btn-minus{border-radius:8px 0 0 8px;margin-right:-1px;}
.btn-plus{border-radius:0 8px 8px 0;margin-left:-1px;}

.input-suffix{
  margin-left:8px;
  color:#666;
  font-size:13px;
  white-space:nowrap;
}

select.w-full{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px;font-size:15px;background:#fff;outline:none;}
select.w-full:focus{border-color:#2563eb;}

/* 网格 */
.grid-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0;}
.grid-row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0;}

/* 结果区 */
.result-box{background:#f7f9fc;padding:16px;border-radius:10px;margin-top:12px;}
.copy-btn{background:#2563eb;color:#fff;border:none;padding:8px 14px;border-radius:8px;margin-top:10px;cursor:pointer;font-size:15px;margin-right:8px;}
.copy-btn:active{background:#1d4ed8;}
.copy-total-btn{background:#10b981;color:#fff;border:none;padding:8px 14px;border-radius:8px;margin-top:10px;cursor:pointer;font-size:15px;margin-right:8px;}
.copy-total-btn:active{background:#059669;}
.reset-btn{background:#6b7280;color:#fff;border:none;padding:8px 14px;border-radius:8px;margin-top:10px;cursor:pointer;font-size:15px;}
.reset-btn:active{background:#4b5563;}
.total-text{font-size:18px;font-weight:bold;color:#1d4ed8;margin-top:12px;}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

hr{border:none;border-top:1px solid #e5e7eb;margin:12px 0;}

/* 移动端适配 */
@media screen and (max-width:768px){
  .grid-row{grid-template-columns:1fr;}
  .grid-row4{grid-template-columns:1fr;}
  .form-item{min-width:100%;}
  .card{padding:14px;}
  body{padding:8px;}
  h1{font-size:1.25rem;}
  .btn-step{width:44px;height:44px;font-size:20px;}
}
</style>
</head>
<body>
<div class="wrap">
<h1>工作量计分计算器</h1>

<div class="card">
<h3>基础配置</h3>
<div class="flex-row">
<div class="form-item">
<label>站点</label>
<select id="site" class="w-full">
<option>长丰</option>
<option>板桥</option>
<option>青龙山</option>
<option>纸坊</option>
<option>前川</option>
<option>野芷湖</option>
<option>黄陂广场</option>
<option>巨龙</option>
</select>
</div>
<div class="form-item">
<label>作业模式</label>
<select id="mode" class="w-full">
<option value="stand10">驻站（10分）</option>
<option value="stand6">17:30-23:00 驻站（6分）</option>
<option value="stand4">6:00-8:30 驻站（4分）</option>
<option value="power">断送电</option>
<option value="morningPower">早起+断送电</option>
<option value="follow">跟活</option>
</select>
</div>
</div>
</div>

<div class="card">
<h3>按列作业（支持0.5列步进）</h3>
<div class="grid-row">
<div class="form-item">
<label>车上实验 <span style="color:#888;font-size:12px;">0.5分/列</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="0.5" min="0" value="0" class="col-input" data-price="0.5">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">列</span>
</div>
</div>
<div class="form-item">
<label>内装检查 <span style="color:#888;font-size:12px;">0.5分/列</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="0.5" min="0" value="0" class="col-input" data-price="0.5">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">列</span>
</div>
</div>
<div class="form-item">
<label>车侧检车 <span style="color:#888;font-size:12px;">1.5分/列</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="0.5" min="0" value="0" class="col-input" data-price="1.5">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">列</span>
</div>
</div>
<div class="form-item">
<label>车下检车 <span style="color:#888;font-size:12px;">1.5分/列</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="0.5" min="0" value="0" class="col-input" data-price="1.5">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">列</span>
</div>
</div>
<div class="form-item">
<label>空调滤网 <span style="color:#888;font-size:12px;">1分/列</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="0.5" min="0" value="0" class="col-input" data-price="1">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">列</span>
</div>
</div>
<div class="form-item">
<label>钢簧检 <span style="color:#888;font-size:12px;">1分/列</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="0.5" min="0" value="0" class="col-input" data-price="1">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">列</span>
</div>
</div>
</div>
</div>

<div class="card">
<h3>按次/件作业（数量×单价）</h3>
<div class="grid-row4">
<div class="form-item">
<label>机洗 <span style="color:#888;font-size:12px;">1分/次</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="1" min="0" value="0" class="once-input" data-price="1" data-unit="次">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">次</span>
</div>
</div>
<div class="form-item">
<label>故障假设 <span style="color:#888;font-size:12px;">2分/个</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="1" min="0" value="0" class="once-input" data-price="2" data-unit="个">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">个</span>
</div>
</div>
<div class="form-item">
<label>处理故障 <span style="color:#888;font-size:12px;">2分/个</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="1" min="0" value="0" class="once-input" data-price="2" data-unit="个">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">个</span>
</div>
</div>
<div class="form-item">
<label>更换备品 <span style="color:#888;font-size:12px;">1分/件</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="1" min="0" value="0" class="once-input" data-price="1" data-unit="件">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">件</span>
</div>
</div>
<div class="form-item">
<label>处理故障复检 <span style="color:#888;font-size:12px;">1分/件</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="1" min="0" value="0" class="once-input" data-price="1" data-unit="件">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">件</span>
</div>
</div>
<div class="form-item">
<label>厂家整改复检 <span style="color:#888;font-size:12px;">1分/次</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="1" min="0" value="0" class="once-input" data-price="1" data-unit="次">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">次</span>
</div>
</div>
<div class="form-item">
<label>消防巡查 <span style="color:#888;font-size:12px;">1分/次</span></label>
<div class="input-wrap">
<button type="button" class="btn-step btn-minus">−</button>
<input type="number" step="1" min="0" value="0" class="once-input" data-price="1" data-unit="次">
<button type="button" class="btn-step btn-plus">+</button>
<span class="input-suffix">次</span>
</div>
</div>
</div>
</div>

<div class="card">
<h3>计分结果</h3>
<div class="result-box">
<div>站点：<span id="resSite">长丰</span></div>
<div>作业模式：<span id="resMode">驻站（10分）</span></div>
<hr>
<div style="font-size:13px;color:#666;">一行式结果（不含总分）</div>
<div id="lineResult" style="padding:8px;background:#eee;border-radius:6px;margin:8px 0;word-break:break-all;font-size:14px;">请填写作业数量</div>
<button class="copy-btn" onclick="copyText()">复制结果</button>
<button class="copy-total-btn" onclick="copyTotalScore()">复制总分</button>
<button class="reset-btn" onclick="resetAll()">重置</button>
<div class="total-text">总分：<span id="totalScore">0</span> 分</div>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var siteSel=document.getElementById('site');
var modeSel=document.getElementById('mode');
var colInputs=document.querySelectorAll('.col-input');
var onceInputs=document.querySelectorAll('.once-input');
var resSite=document.getElementById('resSite');
var resMode=document.getElementById('resMode');
var lineResult=document.getElementById('lineResult');
var totalScoreDom=document.getElementById('totalScore');
var toast=document.getElementById('toast');

var modeMap={
'stand10':{score:10,showName:'驻站10分',displayName:'驻站（10分）'},
'stand6':{score:6,showName:'17:30-23驻站6分',displayName:'17:30-23:00 驻站（6分）'},
'stand4':{score:4,showName:'6:00-8:30驻站4分',displayName:'6:00-8:30 驻站（4分）'},
'power':{score:5,showName:'断送电5分',displayName:'断送电'},
'morningPower':{score:13,showName:'早起8分，断送电5分',displayName:'早起+断送电'},
'follow':{score:0,showName:'跟活',displayName:'跟活'}
};

// 加减按钮逻辑
document.querySelectorAll('.btn-step').forEach(function(btn){
  btn.addEventListener('click',function(){
    var wrap=this.parentElement;
    var input=wrap.querySelector('input[type="number"]');
    var step=parseFloat(input.step)||1;
    var current=parseFloat(input.value)||0;
    if(this.classList.contains('btn-minus')){
      current=current-step;
      if(current<0)current=0;
    }else{
      current=current+step;
    }
    input.value=current;
    input.dispatchEvent(new Event('input'));
  });
});

function showToast(msg){
toast.textContent=msg;
toast.classList.add('show');
setTimeout(function(){toast.classList.remove('show');},1800);
}

function calc(){
var site=siteSel.value;
var modeKey=modeSel.value;
var modeInfo=modeMap[modeKey];
resSite.textContent=site;
resMode.textContent=modeInfo.displayName;

var items=[];
items.push(site+modeInfo.showName);

var columnScore=0;
colInputs.forEach(function(input){
var num=parseFloat(input.value)||0;
var price=parseFloat(input.dataset.price);
var itemScore=num*price;
columnScore+=itemScore;
if(num>0){
var label=input.parentElement.parentElement.querySelector('label').innerText.split(' ')[0];
items.push(label+num+'列'+itemScore+'分');
}
});

var onceScore=0;
onceInputs.forEach(function(input){
var num=parseFloat(input.value)||0;
var price=parseFloat(input.dataset.price);
var unit=input.dataset.unit;
var itemScore=num*price;
onceScore+=itemScore;
if(num>0){
var label=input.parentElement.parentElement.querySelector('label').innerText.split(' ')[0];
items.push(label+num+unit+itemScore+'分');
}
});

var lineStr=items.join('，');
lineResult.textContent=lineStr;
totalScoreDom.textContent=modeInfo.score+columnScore+onceScore;
}

function copyText(){
var txt=lineResult.textContent.trim();
if(txt==='请填写作业数量'){showToast('暂无可复制内容');return;}
doCopy(txt,'结果已复制 ✓');
}

function copyTotalScore(){
var modeKey=modeSel.value;
var modeInfo=modeMap[modeKey];
var colS=0;colInputs.forEach(function(i){colS+=(parseFloat(i.value)||0)*parseFloat(i.dataset.price);});
var onceS=0;onceInputs.forEach(function(i){onceS+=(parseFloat(i.value)||0)*parseFloat(i.dataset.price);});
doCopy(String(modeInfo.score+colS+onceS),'总分已复制 ✓');
}

function doCopy(text,msg){
if(navigator.clipboard&&window.isSecureContext){
navigator.clipboard.writeText(text).then(function(){showToast(msg);});
}else{
var temp=document.createElement('textarea');
temp.value=text;document.body.appendChild(temp);temp.select();
document.execCommand('copy');document.body.removeChild(temp);
showToast(msg);
}
}

function resetAll(){
siteSel.selectedIndex=0;
modeSel.selectedIndex=0;
colInputs.forEach(function(i){i.value=0;});
onceInputs.forEach(function(i){i.value=0;});
calc();
showToast('已重置');
}

siteSel.addEventListener('change',calc);
modeSel.addEventListener('change',calc);
colInputs.forEach(function(i){i.addEventListener('input',calc);});
onceInputs.forEach(function(i){i.addEventListener('input',calc);});
calc();
</script>
</body>
</html>
